<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
      
    <!-- Bootstrap -->
     
     <!-- CSS -->

      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

      <!-- JS -->

       <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
      
</head>
<body>
    
      <div>
         <div class="container w-50  bg-primary bg-gradient p-5 mt-5 mb-5 ">

              <div>
                     <div class="text-center bg-dark text-light p-2"><h2>EVENT REGISTRATION FORM</h2></div>
             </div>

           <form class="p-5 bg-white">

             <div class="row mb-3">
                
                    <label for="name" class=" col-sm-2 col-form-label fw-bold ">Name</label>
                
                <div class="col-sm-5">
                    <input type="text" id="name" placeholder="Enter First Name" class="form-control bg-light">
                    <label for="" class="form-label ms-2 text-secondary">First Name</label>
                </div>
                <div class="col-sm-5">
                    <input type="text" id="name" placeholder="Enter Last Name" class="form-control bg-light ">
                    <label for="" class="form-label ms-2 text-secondary">Last Name</label>
                </div>
            </div>
            <div class="row mb-3">
                <label for="C" class="col-sm-2 col-form-label fw-bold">Company</label>
                <div class="col-sm-10">
                    <input type="text" id="C" placeholder="Enter Company" class="form-control bg-light">
                </div>
            </div>
            <div class="row mb-3">
                <label for="mail" class="col-sm-2 col-form-label fw-bold">Email</label>
                <div class="col-sm-10">
                    <input type="email" id="mail" placeholder="Enter Company" class="form-control bg-light">
                </div>
            </div>
            <div class="row mb-3">
                <label for="phone" class="col-sm-2 col-form-label fw-bold">Phone</label>
                <div class="col-sm-3">
                    <input type="text" class="form-control bg-light" placeholder="+91">
                    <label for="" class="form-label ms-2 text-secondary">Area Code</label>
                </div>
                <div class="col">
                    <input type="text" class="form-control bg-light" placeholder="Enter Phone Number">
                      <label for="" class="form-label ms-2 text-secondary">Phone</label>
                </div>
            </div>
            <div class="row mb-3">
                <label for="" class="col-sm-2 col-form-label fw-bold ">Subject</label>
                <div class="col-sm-10">
                    <select name="" id="" class="form-select bg-light">
                        <option value="" selected >Select An Option</option>
                        <option value="">MERN</option>
                        <option value="">MEAN</option>
                        <option value="">KOTLIN</option>
                    </select>
                </div>
            </div>

             <div class="mt-5">
                <h6 class="fw-bold mb-1"> Are You An Existing Customer?</h6>
                <input type="radio" name="yesorno">
                <label for=""  >Yes</label>
                <input type="radio" class="ms-3" name="yesorno">
                <label for="" >No</label>
            </div>
            <button class="mt-3 rounded-2 bg-danger text-light">Register</button>

           </form>

        </div>

      </div>
       
</body>
</html>
