<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center>
        <form action="">
            <table border="6" width="500px">
        <thead>
            <tr>
                <th colspan="2"><b>Pizza Shop 2.0</b></th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Name</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Pizza Toppings</td>
                <td><input type="radio" name="Top"><label for="">Supreme</label><br>
                    <input type="radio" name="Top"><label for="">Vegetarian</label><br>
                    <input type="radio" name="Top"><label for="">Hawaiian</label>
                </td>
            </tr>
            <tr>
                <td>Pizza Sauce</td>
                <td><select name="" id="">
                    <option value="">Tomato</option>
                    <option value="">Chilli</option>
                    <option value="" selected hidden>Select Sauce</option>
                </select></td>
            </tr>
            <tr>
                <td>Optional Extras</td>
                <td><input type="checkbox"><Label>Extra Cheese</Label>
                <input type="checkbox"><Label>Gluteen free base</Label>
                </td>
            </tr>
            <tr>
                <td colspan="2"><label for="">Delivery Instructions:</label> <br><textarea name="" id="" cols="100" rows="5"></textarea></td>
                
            </tr>
            <tr>
                <td colspan="2"><button>Send My Order</button></td>
            </tr>
        </tbody>
    </table>
        </form>
    </center>
</body>
</html>
