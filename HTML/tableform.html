<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="lightblue">
   <form action="">
     <center>
        <table border="5" width="700px" bgcolor="lightpink">
            <thead>
                    <tr>
                        <th colspan="2"><b>Student Registration Form</b></th>
                    </tr>
            </thead>
            <tbody>
                <tr>
                    <td >Name</td>
                    <td><input type="text" ></td>
                </tr>
                <tr>
                    <td >Father Name</td>
                    <td><input type="text" ></td>
                </tr>
                <tr>
                    <td >Postal Address</td>
                    <td><input type="text" ></td>
                </tr>
                <tr>
                    <td >Personal Address</td>
                    <td><input type="text" ></td>
                </tr>
                <tr>
                    <td>Sex</td>
                    <td><input type="radio" name="Gender">
                    <label for="">Male</label>
                    <input type="radio" name="Gender">
                    <label for="">FeMale</label>
                    </td>
                </tr>
                <tr>
                    <td>City</td>
                    <td>
                        <select name="" id="">
                            <option value="">Thrissur</option>
                            <option value="">Alappuzha</option>
                            <option value="" selected hidden>Select</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Course</td>
                    <td>
                        <select name="" id="">
                            <option value="">MERN</option>
                            <option value="">MEAN</option>
                            <option value="" selected hidden>Select</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>District</td>
                    <td>
                        <select name="" id="">
                            <option value="">Thrissur</option>
                            <option value="">Alappuzha</option>
                            <option value="" selected hidden>Select</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>State</td>
                    <td>
                        <select name="" id="">
                            <option value="">Kerala</option>
                            <option value="">Tamilnadu</option>
                            <option value="" selected hidden>Select</option>
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Pincode</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td>EmailId</td>
                    <td><input type="email"></td>
                </tr>
                <tr>
                    <td>DOB</td>
                    <td><input type="date"></td>
                </tr>
                <tr>
                    <td>MobileNo</td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><button>Reset</button></td>
                    <td><input type="button" value="Submit Form"></td>
                </tr>
            </tbody>
        </table>
    </center>
   </form>
</body>
</html>
