<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
   <center>
    <form action=" ">
            <table bgcolor="lightgrey" height="300px" width="500px">
        <caption><u><h3>Project Management</h3><br></u></caption>
       <tbody ><br>
        <tr>
            <td><b>Project Name</b></td>
            <td><input type="text" placeholder="Enter Project Name">
            </td>
        </tr>
        <tr>
            <td><b>Assigned To</b></td>
            <td><select name="" id="">
                <option value="">Leo</option>
                <option value="">Srank</option>
                <option value="" selected hidden>Choose an Option</option>
            </select>
            </td>
        </tr>
            <tr>
                <td><b>Start Date</b>
                </td>
                <td>
                    <input type="date">
                </td>
            </tr>
            <tr>
                <td><b>End Date</b>
                </td>
                <td>
                    <input type="date">
                </td>
            </tr>
            <tr>
                <td><B>Priority</B></td>
                <td>
                    <input type="radio" name="Prio">
                    <label for="">High</label>
                    <input type="radio" name="Prio">
                    <label for="">Average</label>
                    <input type="radio" name="Prio">
                    <label for="">Low</label>
                </td>
            </tr>
            <tr>
                <td><b>Description</b></td>
                <td><textarea name="" id="" cols="50" rows="3"></textarea></td>
            </tr>
            <tr>
                <td colspan="2" align="center" ><button>Submit</button> <button >Clear</button></td>
            </tr>
       </tbody>
    </table>
    </form>
    </center>
</body>
</html>
