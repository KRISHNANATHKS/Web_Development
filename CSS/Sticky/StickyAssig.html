<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="StickyAssi.css">
</head>
<body>
    <h1 style="width: 800px; padding:10px;">Sticky Positioning</h1>
    <div>
        <div>
            <h3>A</h3>
            <div>
                <!-- use description list like dl dt dd -->
                <ul type="none">
                    <li>Apple</li>
                    <li>Apricot</li>
                    <li>Avacado</li>
                </ul>
            </div>
        </div>
        <div>
            <h3>B</h3>
            <div>
                <ul type="none">
                    <li>Blue Berry</li>
                    <li>Banana</li>
                    <li>Black Berry</li>
                </ul>
            </div>
        </div>
        <div>
            <h3>C</h3>
            <div>
                <ul type="none">
                    <li>Cran Berry</li>
                    <li>Corn</li>
                    <li>Carrot</li>
                </ul>
            </div>
        </div>
        <div>
            <h3>D</h3>
            <div>
                <ul type="none">
                    <li>Dragon Fruit</li>
                    <li>Durian</li>
                    <li>Dates</li>
                </ul>
            </div>
        </div>
        <div>
            <h3>E</h3>
            <div>
                <ul type="none">
                    <li>Etrog</li>
                    <li>Egg Fruit</li>
                    <li>European Pear</li>
                </ul>
            </div>
        </div>
    </div>
</body>
</html>
