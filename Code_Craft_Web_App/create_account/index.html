<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft - Build • Learn • Create</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
          <link rel="icon" href="../assets/logo.png">
</head>

<body class="min-h-screen bg-[#111827] flex items-center justify-center">

    <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="text-center mb-8">

            <div class="mx-auto w-14 h-14 rounded-2xl pb-1
                        bg-gradient-to-tr from-purple-600 to-pink-500
                        flex items-center justify-center
                        text-white text-2xl font-bold shadow-lg">
                &lt;/&gt;
            </div>

            <h1 class="text-3xl font-bold text-white mt-4">
                CodeCraft
            </h1>

            <p class="text-sm text-gray-400 mt-1">
                Build • Learn • Create
            </p>

        </div>


        <!-- Card -->
        <div class="bg-[#172033] border border-gray-700
                    rounded-2xl p-7 shadow-2xl">

            <div class="text-center mb-6">

                <h2 class="text-2xl font-bold text-white">
                    Create Account
                </h2>

                <p class="text-sm text-gray-400 mt-2">
                    Create your CodeCraft account
                </p>

            </div>


            <!-- Username -->
            <div class="mb-5">

                <label class="block text-sm text-gray-300 mb-2">
                    User Name
                </label>

                <div class="relative">

                    <i class="fa-solid fa-user absolute left-4 top-1/2
                              -translate-y-1/2 text-gray-500"></i>

                    <input
                    id="Uname"
                        type="text"
                        placeholder="Enter username"
                        class="w-full bg-[#111827]
                               border border-gray-700
                               rounded-xl py-3 pl-11 pr-4
                               text-white placeholder-gray-500
                               outline-none
                               focus:border-purple-500
                               focus:ring-2 focus:ring-purple-500/20">
                </div>

            </div>


            <!-- Password -->
            <div class="mb-6">

                <label class="block text-sm text-gray-300 mb-2">
                    Password
                </label>

                <div class="relative">

                    <i class="fa-solid fa-lock absolute left-4 top-1/2
                              -translate-y-1/2 text-gray-500"></i>

                    <input
                        id="Upass"
                        type="password"
                        placeholder="Create password"
                        class="w-full bg-[#111827]
                               border border-gray-700
                               rounded-xl py-3 pl-11 pr-4
                               text-white placeholder-gray-500
                               outline-none
                               focus:border-purple-500
                               focus:ring-2 focus:ring-purple-500/20">
                </div>

            </div>


            <!-- Button -->
            <button onclick="CreateAcc()"
                class="w-full py-3 rounded-xl mt-5
                       bg-gradient-to-r from-blue-500 via-purple-600 to-pink-500
                       text-white font-semibold
                       hover:-translate-y-0.5
                       transition duration-300
                       cursor-pointer">

                <i class="fa-solid fa-user-plus mr-2"></i>
                Create Account

            </button>


            <!-- Login -->
            <p class="text-center text-sm text-gray-400 mt-6">

                Already have an account?

                <a onclick="backtologin()"
                   class="text-purple-400 font-semibold hover:text-pink-400 hover:cursor-pointer">
                    Login
                </a>

            </p>

        </div>

    </div>

    <script>
        function CreateAcc(){
            const uname=Uname.value;
            const upass=Upass.value;
            if(uname in localStorage){
                alert(`User Name ${uname} Already Exist`)
            }
            else{
                localStorage.setItem(uname,JSON.stringify(upass));
                alert(`Account Created Successfully`);
                window.location.replace("../index.html");
              
            }
            Uname.value=""
            Upass.value=""
        }

        function backtologin(){
            window.location.replace("../index.html");
        }
    </script>
</body>
</html>
