<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeCraft - Build • Learn • Create</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
          <link rel="icon" href="./logo.png">
</head>

<body class="min-h-screen bg-[#111827] flex items-center justify-center px-5">

    <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="text-center mb-8">

            <div class="mx-auto w-14 h-14 rounded-2xl 
                        bg-gradient-to-tr from-purple-600 to-pink-500
                        flex items-center justify-center
                        text-white text-2xl font-bold shadow-lg pb-2">
                &lt;/&gt;
            </div>

            <h1 class="text-3xl font-bold text-white mt-4">
                CodeCraft
            </h1>

            <p class="text-sm text-gray-400 mt-1">
                Build • Learn • Create
            </p>

        </div>


        <!-- Login Card -->
        <div class="bg-[#172033] border border-gray-700/70
                    rounded-2xl p-7 shadow-2xl">

            <div class="text-center mb-7">

                <h2 class="text-2xl font-bold
                           bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400
                           bg-clip-text text-transparent">
                    Welcome Back
                </h2>

                <p class="text-gray-400 text-sm mt-2">
                    Login to explore your CodeCraft tools
                </p>

            </div>


            <!-- UserName -->
            <div class="mb-5">

                <label class="block text-sm font-medium text-gray-300 mb-2">
                    User Name
                </label>

                <div class="relative">

                    <i class="fa-solid fa-envelope absolute left-4 top-1/2
                              -translate-y-1/2 text-gray-500"></i>

                    <input
                        id="Uname"
                        type="text"
                        placeholder="Enter your username"
                        class="w-full bg-[#111827]
                               border border-gray-700
                               rounded-xl py-3 pl-11 pr-4
                               text-white placeholder-gray-500
                               outline-none
                               focus:border-purple-500
                               focus:ring-2 focus:ring-purple-500/20
                               transition duration-300"
                    >

                </div>

            </div>


            <!-- Password -->
            <div class="mb-4">

                <label class="block text-sm font-medium text-gray-300 mb-2">
                    Password
                </label>

                <div class="relative">

                    <i class="fa-solid fa-lock absolute left-4 top-1/2
                              -translate-y-1/2 text-gray-500"></i>

                    <input
                        id="Upass"
                        type="password"
                        placeholder="Enter your password"
                        class="w-full bg-[#111827]
                               border border-gray-700
                               rounded-xl py-3 pl-11 pr-4
                               text-white placeholder-gray-500
                               outline-none
                               focus:border-purple-500
                               focus:ring-2 focus:ring-purple-500/20
                               transition duration-300"
                    >

                </div>

            </div>


          

            <!-- Login Button -->
            <button
                onclick="Logind()"
                class="w-full py-3 rounded-xl mt-4
                       bg-gradient-to-r from-blue-500 via-purple-600 to-pink-500
                       text-white font-semibold
                       shadow-lg
                       hover:shadow-purple-500/30
                       hover:-translate-y-0.5
                       transition duration-300
                       cursor-pointer">

                <i class="fa-solid fa-right-to-bracket mr-2"></i>
                Login

            </button>


            <!-- Register -->
            <p class="text-center text-sm text-gray-400 mt-6">

                Don't have an account?

                <a href="./CreateAccount.html"
                   class="text-purple-400 font-semibold
                          hover:text-pink-400 transition">
                    Create Account
                </a>

            </p>

        </div>


        <!-- Footer -->
        <p class="text-center text-xs text-gray-600 mt-6">
            © 2026 CodeCraft. All rights reserved.
        </p>

    </div>

    <script>
        function Logind(){
            const uname=Uname.value;
            const upass=Upass.value;
             
            if(uname in localStorage){
                const data=JSON.parse(localStorage.getItem(uname))
                
                if(upass===data){
                    window.location.href="../index.html"
                    localStorage.setItem("UserName",JSON.stringify(uname))
                    console.log(uname)
                    alert(`Logged in Successfully!`)
                }
                 else{
                alert(`Invalid  Password`)
            }
            }
            else{
                alert(`Invalid User Name or Password`)
            }
            Uname.value=""
            Upass.value=""
        }
    </script>

</body>
</html>
